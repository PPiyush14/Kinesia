[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinesia"
version = "1.0.0"
description = "Real-Time Multilingual Dialogue & Collaborative Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26,<3",
    "google-cloud-texttospeech>=2.21,<3",
    "edge-tts>=7.0,<8",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "sounddevice>=0.4.7,<1",
    "websocket-client>=1.8,<2",
    "websockets>=14,<16",
    "spacy>=3.7,<4",
    "sacrebleu>=2.4,<3",
    "jiwer>=3.0,<5",
    "matplotlib>=3.9,<4",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
kinesia = "backend.cli:main"
kinesia-web = "backend.dashboard_server:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
